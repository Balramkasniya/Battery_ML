<!DOCTYPE html>
<html>
<head>
  <title>EdgeBattery Dashboard</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js"></script>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f4f4f4; }
    h1 { color: #2c3e50; }
    .card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 15px;
      margin: 15px 0;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      max-width: 600px;
    }
    .label { font-weight: bold; }
    .alert { color: red; font-weight: bold; }
  </style>
</head>
<body>
  <h1>🔋 EdgeBattery Live Dashboard</h1>

  <div class="card">
    <p><span class="label">Cycle:</span> <span id="cycle">--</span></p>
    <p><span class="label">Current:</span> <span id="current">--</span> A</p>
    <p><span class="label">Pack Voltage:</span> <span id="voltage">--</span> V</p>
    <p><span class="label">Cell Voltages:</span> <span id="vcell">--</span></p>
    <p><span class="label">Cell Temps (°C):</span> <span id="tcell">--</span></p>
    <p><span class="label">Fault Label:</span> <span id="fault">--</span></p>
  </div>

  <div class="card">
    <h3>🔥 Fire Risk Alerts</h3>
    <p>Cell 1: <span id="fire1">--</span></p>
    <p>Cell 2: <span id="fire2">--</span></p>
    <p>Cell 3: <span id="fire3">--</span></p>
    <p>Cell 4: <span id="fire4">--</span></p>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyASIqHvNn6hHBb790JmFxWZm2EDFIpfu8Y",
      authDomain: "edgebattery.firebaseapp.com",
      databaseURL: "https://edgebattery-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "edgebattery",
      storageBucket: "edgebattery.firebasestorage.app",
      messagingSenderId: "1019264375270",
      appId: "1:1019264375270:web:728f47a18e343391bf1e27",
      measurementId: "G-9JWBMWDRY7"
    };

    const app = firebase.initializeApp(firebaseConfig);
    const db = firebase.getDatabase(app);

    const liveRef = firebase.ref(db, "battery_live_stream");
    const alertsRef = firebase.ref(db, "battery_alerts");

    firebase.onValue(liveRef, (snapshot) => {
      const d = snapshot.val();
      if (d) {
        document.getElementById("cycle").textContent = d.Cycle || "--";
        document.getElementById("current").textContent = d.Current || "--";
        document.getElementById("voltage").textContent = d.PackVoltage || "--";
        document.getElementById("vcell").textContent =
          [d.V_Cell1, d.V_Cell2, d.V_Cell3, d.V_Cell4].join(" | ");
        document.getElementById("tcell").textContent =
          [d.T_Cell1, d.T_Cell2, d.T_Cell3, d.T_Cell4].join(" | ");
        document.getElementById("fault").textContent =
          d.FaultLabel == 1 ? "⚠️ FAULT" : "✅ Normal";
      }
    });

    firebase.onValue(alertsRef, (snapshot) => {
      const d = snapshot.val();
      if (d) {
        document.getElementById("fire1").textContent = d.FireRisk_Cell1 || "--";
        document.getElementById("fire2").textContent = d.FireRisk_Cell2 || "--";
        document.getElementById("fire3").textContent = d.FireRisk_Cell3 || "--";
        document.getElementById("fire4").textContent = d.FireRisk_Cell4 || "--";
      }
    });
  </script>
</body>
</html>
